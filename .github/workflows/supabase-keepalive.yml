name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 06:00 UTC (11:30 AM IST) — prevents Supabase free-tier pause (7-day inactivity threshold)
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 72.61.233.12 >> ~/.ssh/known_hosts

      - name: Ping Supabase via VPS (service role key bypasses RLS — ensures real DB query)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@72.61.233.12 bash << 'ENDSSH'
            set -e
            source /var/www/shivam_narthanalayam/.env
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              "https://xwezofnczncozhxjbijr.supabase.co/rest/v1/enquiries?select=id&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Prefer: count=exact")
            STATUS=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)
            echo "Supabase ping status: $STATUS"
            echo "Response body: $BODY"
            if [ "$STATUS" -ge 400 ]; then
              echo "❌ Supabase ping failed — project may be paused or key is invalid"
              exit 1
            fi
            echo "✅ Supabase is alive and DB query executed"
          ENDSSH
