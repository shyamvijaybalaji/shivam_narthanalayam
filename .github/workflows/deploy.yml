name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.61.233.12
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/shivam_narthanalayam
            git pull origin main
            docker-compose up --build -d
            echo "Deployed successfully at $(date)"
