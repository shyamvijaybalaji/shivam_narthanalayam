version: '3.8'

services:
  web:
    build:
      context: .
      args:
        - PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL}
        - PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY}
        - PUBLIC_SITE_URL=${PUBLIC_SITE_URL}
        - PUBLIC_SITE_NAME=${PUBLIC_SITE_NAME}
        - PUBLIC_PHONE=${PUBLIC_PHONE}
        - PUBLIC_EMAIL=${PUBLIC_EMAIL}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - RESEND_API_KEY=${RESEND_API_KEY}
        - ADMIN_EMAIL=${ADMIN_EMAIL}
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL}
      - PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL}
      - PUBLIC_SITE_NAME=${PUBLIC_SITE_NAME}
      - PUBLIC_PHONE=${PUBLIC_PHONE}
      - PUBLIC_EMAIL=${PUBLIC_EMAIL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - CALLMEBOT_API_KEY=${CALLMEBOT_API_KEY}
      - CALLMEBOT_PHONE=${CALLMEBOT_PHONE}
      - TEXTMEBOT_API_KEY=${TEXTMEBOT_API_KEY}
      - TEXTMEBOT_PHONE=${TEXTMEBOT_PHONE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
